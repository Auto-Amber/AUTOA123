const SL=[
{
  "heading":"The High-Current Path and Solenoid Operation",
  "icon":"⚡",
  "svg":"<svg viewBox=\"0 0 700 190\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#ffffff;border-radius:8px;margin:10px 0 8px;display:block;max-width:100%\"><text x=\"350\" y=\"15\" font-size=\"11\" fill=\"#555555\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">HIGH-CURRENT PATH — BATTERY TO MOTOR</text><rect x=\"20\" y=\"35\" width=\"100\" height=\"40\" fill=\"#fffbf0\" stroke=\"#e9a825\" stroke-width=\"2\" rx=\"5\"/><text x=\"70\" y=\"53\" font-size=\"10\" fill=\"#e9a825\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">BATTERY</text><text x=\"70\" y=\"66\" font-size=\"9\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">12V, 150–300A</text><line x1=\"120\" y1=\"55\" x2=\"155\" y2=\"55\" stroke=\"#e9a825\" stroke-width=\"3\"/><rect x=\"155\" y=\"28\" width=\"160\" height=\"90\" fill=\"#f0faf8\" stroke=\"#2a9d8f\" stroke-width=\"2\" rx=\"6\"/><text x=\"235\" y=\"46\" font-size=\"10\" fill=\"#2a9d8f\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">SOLENOID</text><rect x=\"170\" y=\"54\" width=\"65\" height=\"28\" fill=\"#1a1a1a\" stroke=\"#2a9d8f\" stroke-width=\"1.5\" rx=\"3\"/><text x=\"202\" y=\"66\" font-size=\"8.5\" fill=\"#2a9d8f\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">PULL-IN</text><text x=\"202\" y=\"76\" font-size=\"8\" fill=\"#aaa\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">COIL</text><rect x=\"245\" y=\"54\" width=\"60\" height=\"28\" fill=\"#1a1a1a\" stroke=\"#555\" stroke-width=\"1\" rx=\"3\"/><text x=\"275\" y=\"66\" font-size=\"8.5\" fill=\"#aaa\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">HOLD-IN</text><text x=\"275\" y=\"76\" font-size=\"8\" fill=\"#aaa\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">COIL</text><text x=\"235\" y=\"104\" font-size=\"8.5\" fill=\"#555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Plunger closes main contacts</text><text x=\"235\" y=\"114\" font-size=\"8.5\" fill=\"#555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">AND shifts drive gear into ring gear</text><line x1=\"315\" y1=\"55\" x2=\"350\" y2=\"55\" stroke=\"#e9a825\" stroke-width=\"3\"/><rect x=\"350\" y=\"35\" width=\"120\" height=\"40\" fill=\"#fff5f5\" stroke=\"#cc0000\" stroke-width=\"2\" rx=\"5\"/><text x=\"410\" y=\"53\" font-size=\"10\" fill=\"#cc0000\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">CONTACTS</text><text x=\"410\" y=\"66\" font-size=\"9\" fill=\"#555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">High-resistance fail point</text><line x1=\"470\" y1=\"55\" x2=\"505\" y2=\"55\" stroke=\"#e9a825\" stroke-width=\"3\"/><rect x=\"505\" y=\"35\" width=\"100\" height=\"40\" fill=\"#f0faf8\" stroke=\"#2a9d8f\" stroke-width=\"2\" rx=\"5\"/><text x=\"555\" y=\"53\" font-size=\"10\" fill=\"#2a9d8f\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">MOTOR</text><text x=\"555\" y=\"66\" font-size=\"9\" fill=\"#555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Cranks engine</text><line x1=\"605\" y1=\"55\" x2=\"660\" y2=\"55\" stroke=\"#555\" stroke-width=\"2\" stroke-dasharray=\"4,3\"/><rect x=\"20\" y=\"140\" width=\"660\" height=\"38\" fill=\"#f5f5f5\" stroke=\"#d0d0d0\" stroke-width=\"1\" rx=\"5\"/><text x=\"350\" y=\"157\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">Return path: motor case → engine block → negative battery cable → battery negative</text><text x=\"350\" y=\"170\" font-size=\"8.5\" fill=\"#555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Ground path resistance is as critical as positive side — a bad engine block ground fails the same as a bad positive cable</text></svg>",
  "body":[
    "Once the relay closes and battery voltage reaches the solenoid <strong>S terminal</strong>, the post-engagement sequence begins. The solenoid does two things simultaneously: it <strong>closes the main high-current contacts</strong> (connecting battery B+ to the motor) and mechanically <strong>shifts the drive gear (Bendix) into mesh with the ring gear</strong>.",
    "The solenoid contains two coils: a <strong>pull-in coil</strong> (draws the plunger in with high force) and a <strong>hold-in coil</strong> (holds it in place with less current once pulled in). When the main contacts close, the pull-in coil is bypassed — only the hold-in coil stays energized.",
    "Current through the motor during cranking is enormous — typically <strong>150–300 amperes</strong> depending on engine size and temperature. Cold, tight engines and high-compression engines draw more. This is why cable and connection quality matters so much.",
    "The <strong>return path</strong> runs through the motor case, the engine block, and the negative battery cable back to the battery. A corroded engine-to-chassis ground strap or a bad battery negative cable causes the exact same symptoms as a bad positive cable or bad motor — slow crank, no crank, or clicking."
  ]
},
{
  "heading":"Voltage Drop Testing the Starter Circuit",
  "icon":"📏",
  "svg":"<svg viewBox=\"0 0 700 190\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#ffffff;border-radius:8px;margin:10px 0 8px;display:block;max-width:100%\"><text x=\"350\" y=\"15\" font-size=\"11\" fill=\"#555555\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">STARTER CIRCUIT VOLTAGE DROP — TEST POINTS</text><rect x=\"15\" y=\"28\" width=\"320\" height=\"148\" fill=\"#f0faf8\" stroke=\"#2a9d8f\" stroke-width=\"2\" rx=\"7\"/><text x=\"175\" y=\"46\" font-size=\"10\" fill=\"#2a9d8f\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">POSITIVE SIDE TEST POINTS</text><text x=\"175\" y=\"62\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">① Battery (+) post → Solenoid B+ terminal</text><text x=\"175\" y=\"76\" font-size=\"9\" fill=\"#555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Spec: under 0.5V while cranking</text><text x=\"175\" y=\"92\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">② Solenoid B+ → Motor feed terminal</text><text x=\"175\" y=\"106\" font-size=\"9\" fill=\"#555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Checks solenoid contact resistance</text><text x=\"175\" y=\"120\" font-size=\"9\" fill=\"#cc0000\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">Over 0.2V across contacts = worn/pitted</text><line x1=\"35\" y1=\"132\" x2=\"315\" y2=\"132\" stroke=\"#d0ede8\" stroke-width=\"0.8\"/><text x=\"175\" y=\"148\" font-size=\"9\" fill=\"#e9a825\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">Perform during cranking — not at rest</text><text x=\"175\" y=\"162\" font-size=\"8.5\" fill=\"#555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Must have current flowing to show resistance</text><rect x=\"355\" y=\"28\" width=\"330\" height=\"148\" fill=\"#f5f5f5\" stroke=\"#555\" stroke-width=\"1\" rx=\"7\"/><text x=\"520\" y=\"46\" font-size=\"10\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">NEGATIVE (GROUND) SIDE TEST POINTS</text><text x=\"520\" y=\"62\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">① Motor case → Engine block</text><text x=\"520\" y=\"76\" font-size=\"9\" fill=\"#555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Checks motor-to-block ground</text><text x=\"520\" y=\"92\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">② Engine block → Battery (−) post</text><text x=\"520\" y=\"106\" font-size=\"9\" fill=\"#555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Checks negative cable and connections</text><text x=\"520\" y=\"120\" font-size=\"9\" fill=\"#cc0000\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">Fix ground BEFORE condemning motor</text><line x1=\"370\" y1=\"132\" x2=\"670\" y2=\"132\" stroke=\"#d0d0d0\" stroke-width=\"0.8\"/><text x=\"520\" y=\"148\" font-size=\"9\" fill=\"#555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Remember: DVOM reads voltage stolen</text><text x=\"520\" y=\"162\" font-size=\"8.5\" fill=\"#555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">by resistance — lower is always better</text></svg>",
  "body">[
    "Voltage drop testing the starter circuit finds <strong>resistance that is stealing voltage before it reaches the motor</strong>. Every millivolt measured is voltage that isn't spinning the starter. The test must be performed <strong>while cranking</strong> — with current flowing. Testing at rest shows nothing.",
    "<strong>Positive side:</strong> RED lead at battery positive post, BLACK lead at the motor feed terminal. Cranking spec: <strong>under 0.5V total</strong>. Then isolate the solenoid contacts: RED on solenoid B+ terminal, BLACK on motor feed terminal — spec <strong>under 0.2V</strong>. Over spec = pitted or burned solenoid contacts.",
    "<strong>Negative side:</strong> RED lead at motor case, BLACK lead at battery negative post. Spec: <strong>under 0.5V total</strong>. Break it down: motor-to-block, then block-to-battery. High ground-side reading is a very common cause of slow or intermittent crank that gets misdiagnosed as a bad battery or starter motor.",
    "<strong>Interpreting totals:</strong> Add positive-side and negative-side drops together. If the combined drop is more than 0.5–0.6V, the starter motor is receiving significantly less than battery voltage. A motor that receives 11.2V when the battery is at 12.6V is working with 1.4V stolen by circuit resistance."
  ]
},
{

font-family=\"Arial,sans-serif\">Over spec</text><text x=\"355\" y=\"76\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Worn motor (shorted windings)</text><text x=\"355\" y=\"90\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Tight engine (mechanical drag)</text><text x=\"355\" y=\"104\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Wrong oil viscosity</text><text x=\"355\" y=\"118\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Drive gear binding on ring gear</text><rect x=\"475\" y=\"28\" width=\"210\" height=\"140\" fill=\"#fffbf0\" stroke=\"#e9a825\" stroke-width=\"2\" rx=\"7\"/><text x=\"580\" y=\"46\" font-size=\"10\" fill=\"#b07d00\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">LOW DRAW</text><text x=\"580\" y=\"62\" font-size=\"9\" fill=\"#b07d00\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">Under spec</text><text x=\"580\" y=\"76\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Voltage drop in circuit</text><text x=\"580\" y=\"90\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Worn brushes in motor</text><text x=\"580\" y=\"104\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Open field winding</text><text x=\"580\" y=\"118\" font-size=\"9\" fill=\"#cc0000\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">Low draw + slow crank =</text><text x=\"580\" y=\"132\" font-size=\"9\" fill=\"#cc0000\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">circuit resistance first</text></svg>",
  "body":[
    "Current draw testing measures <strong>how many amperes the starter motor is consuming</strong> during cranking. The test uses an inductive ammeter clamp around the positive battery cable. Battery must be at least 75% charged first — a weak battery limits available current and produces artificially low readings.",
    "<strong>High current draw with slow crank</strong> points to mechanical problems — the motor is working hard against something. Check for a tight or seized engine (try turning by hand at the crank bolt), wrong oil viscosity, or a worn motor with shorted armature windings consuming excess current.",
    "<strong>Low current draw with slow or no crank</strong> points to circuit resistance — the motor isn't getting enough current to do its job. Perform voltage drop tests on both sides of the circuit before replacing the motor. Low draw can also indicate worn brushes or an open field winding inside the motor.",
    "<strong>Normal current, slow crank:</strong> The most overlooked cause is a <strong>discharged or weak battery</strong>. Current may look normal on a weak battery, but cranking voltage collapses below 9.6V. Always confirm the battery passes a load test before evaluating the starter circuit."
  ]
}

const QS=[
{
  "text":"During a starter voltage drop test, a technician measures 0.8V across the positive battery cable while cranking. What does this indicate and what should be done?",
  "choices":[
    "0.8V is acceptable — the spec is under 1.0V for the positive cable",

{
  "text":"A customer's V8 truck cranks slowly in cold weather. Current draw tests at 340A — well above the 250A spec. Battery tests good. What is the most likely cause?",
  "choices":[

    "Worn starter motor with shorted armature windings, or mechanical engine drag",
    "Low battery voltage reducing available current and making the motor work harder",
    "Solenoid contacts are pitted, restricting current flow"
  ],
  "correct":1,
  "explanation":"High current draw above spec with a good battery points to the motor working against excess mechanical resistance — the most common causes are a worn motor with shorted armature windings (lower internal resistance = higher current draw) or mechanical drag in the engine itself (tight bearings, wrong viscosity oil especially in cold weather). A bad ground or pitted contacts would reduce available current (low draw), not increase it. Rule out a mechanical engine problem first by attempting to rotate the engine by hand at the crank bolt."
},
{
  "text":"The solenoid on a starter motor does which TWO things when energized?",
  "choices":[
    "Provides power to the control circuit relay and signals the PCM",
    "Closes the main high-current contacts AND shifts the drive gear into the ring gear",
    "Energizes the hold-in coil and opens the pull-in coil simultaneously",
    "Disconnects the control circuit and connects the battery directly to the motor field windings"
  ],
  "correct":1,
  "explanation":"The solenoid is a two-function device: (1) its plunger mechanically shifts the overrunning clutch drive gear (Bendix) into mesh with the flywheel ring gear, and (2) as the plunger reaches the end of its travel, it closes the main high-current contacts connecting battery B+ to the starter motor. These two events happen in rapid sequence — the drive gear engages just before the motor starts spinning, preventing the motor from freewheeling against an unengaged ring gear."

];
const TOT=SL.length+QS.length;
let cur=0,ans=new Array(QS.length).fill(false);
const LT=['A','B','C','D'];
function prog(n){const p=Math.round(n/TOT*100);document.getElementById('prog-bar').style.width=p+'%';document.getElementById('prog-lbl').textContent='Progress — '+p+'%';}
function go(d){cur+=d;if(cur<0)cur=0;if(cur>=TOT)return;render();}
function render(){
  const el=document.getElementById('content');
  const isS=cur<SL.length;
  document.getElementById('back-btn').disabled=(cur===0);
  document.getElementById('next-btn').disabled=false;
  document.getElementById('next-btn').classList.remove('locked');
  if(cur>=TOT){prog(TOT);el.innerHTML='';showDone(el);document.getElementById('nav').style.display='none';return;}
  prog(cur);
  document.getElementById('nav').style.display='flex';
  if(isS){document.getElementById('step-ind').textContent='Slide '+(cur+1)+' of '+SL.length;renderS(SL[cur],el);}
  else{const qi=cur-SL.length;document.getElementById('step-ind').textContent='Question '+(qi+1)+' of '+QS.length;if(!ans[qi]){document.getElementById('next-btn').classList.add('locked');document.getElementById('next-btn').disabled=true;}renderQ(qi,QS[qi],el);}
}
function renderS(s,el){const body=s.body.map(b=>'<p>'+b+'</p>').join('');el.innerHTML='<div class="slide active"><span class="slide-icon">'+s.icon+'</span><h2>'+s.heading+'</h2>'+(s.svg?'<div class="slide-svg">'+s.svg+'</div>':'')+'<div class="slide-body">'+body+'</div></div>';}
function renderQ(qi,q,el){const ch=q.choices.map((c,i)=>'<li><button class="ch-btn" onclick="pick('+qi+','+i+',this)" id="c'+qi+'_'+i+'"><span class="letter">'+LT[i]+'</span><span>'+c+'</span></button></li>').join('');el.innerHTML='<div class="quiz active"><div class="quiz-lbl">Knowledge Check · Question '+(qi+1)+' of '+QS.length+'</div><h2>'+q.text+'</h2><ul class="choices">'+ch+'</ul><div class="feedback" id="fb'+qi+'"></div></div>';if(ans[qi])restoreQ(qi,q);}
function pick(qi,ch,btn){if(ans[qi])return;ans[qi]=true;const q=QS[qi],ok=q.correct;document.querySelectorAll('.ch-btn').forEach((b,i)=>{b.disabled=true;if(i===ok)b.classList.add(ch===ok?'correct':'revealed');});if(ch!==ok)btn.classList.add('wrong');const fb=document.getElementById('fb'+qi);fb.className='feedback '+(ch===ok?'correct':'wrong');fb.innerHTML='<strong>'+(ch===ok?'✓ Correct!':'✗ Not quite.')+'</strong>'+q.explanation;document.getElementById('next-btn').classList.remove('locked');document.getElementById('next-btn').disabled=false;if(qi===QS.length-1)document.getElementById('next-btn').textContent='Finish →';}
function restoreQ(qi,q){document.querySelectorAll('.ch-btn').forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('revealed');});const fb=document.getElementById('fb'+qi);if(fb){fb.className='feedback correct';fb.innerHTML='<strong>Already answered.</strong>';}}
function showDone(el){el.innerHTML='<div id="complete"><span class="ck">✅</span><h3>Lesson Complete</h3><p>All slides and knowledge check questions finished.</p><button class="restart" onclick="restart()">&#8635; Restart Lesson</button></div>';}
function restart(){cur=0;ans=new Array(QS.length).fill(false);document.getElementById('next-btn').textContent='Next →';document.getElementById('nav').style.display='flex';render();}
render();
</script>
</body>
</html>
