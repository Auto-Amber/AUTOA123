<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charging Systems — Testing Sequence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#2a9d8f;--teal-bg:#f0faf8;--teal-dk:#0d2b28;--amber:#e9a825;--amber-bg:#fffbf0;--dark:#1a1a1a;--muted:#555555;--lgray:#f5f5f5;--white:#fff;--red:#cc0000;}
html,body{height:100%;font-family:"Source Sans 3",Arial,sans-serif;background:var(--dark);color:var(--dark);font-size:15px;line-height:1.5}
#shell{display:flex;flex-direction:column;min-height:100vh;max-width:780px;margin:0 auto;background:var(--white)}
header{background:var(--dark);border-top:5px solid var(--teal);padding:12px 20px 10px}
.course-label{color:var(--teal);font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:2px}
header h1{font-family:"Oswald",Arial,sans-serif;font-size:17px;color:#fff;font-weight:700;margin-bottom:1px;line-height:1.2}
header .sub{color:#aaa;font-size:11.5px}
#prog-wrap{background:#2a2a2a;border-bottom:1px solid #333;padding:8px 20px 7px}
#prog-lbl{color:#aaa;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
#prog-track{background:#3a3a3a;border-radius:4px;height:6px;overflow:hidden}
#prog-bar{background:var(--amber);height:100%;border-radius:4px;width:0%;transition:width .35s ease}
#content{flex:1;padding:16px 18px 12px;overflow-y:auto}
.slide,.quiz{display:none;animation:fi .25s ease}
.slide.active,.quiz.active{display:block}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.slide-icon{font-size:26px;display:block;margin-bottom:5px}
.slide h2{font-family:"Oswald",Arial,sans-serif;font-size:18px;font-weight:700;color:var(--teal);margin-bottom:8px;line-height:1.2}
.slide-svg{width:100%;margin:6px 0 10px;display:block}
.slide-body{background:var(--lgray);border-left:4px solid var(--teal);border-radius:0 7px 7px 0;padding:11px 14px;font-size:13.5px;line-height:1.6}
.slide-body p{margin-bottom:6px}.slide-body p:last-child{margin-bottom:0}
.quiz-lbl{color:var(--teal);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;margin-bottom:5px}
.quiz h2{font-size:14.5px;font-weight:700;color:var(--dark);margin-bottom:12px;line-height:1.45}
.choices{list-style:none;display:flex;flex-direction:column;gap:7px}
.ch-btn{display:flex;align-items:flex-start;gap:9px;background:#fff;border:2px solid #d0d0d0;border-radius:7px;padding:9px 12px;cursor:pointer;font-family:"Source Sans 3",Arial,sans-serif;font-size:13.5px;line-height:1.45;color:var(--dark);text-align:left;transition:border-color .15s,background .15s;width:100%}
.ch-btn:hover:not(:disabled){border-color:var(--teal);background:var(--teal-bg)}
.letter{flex-shrink:0;background:#e8e8e8;color:var(--muted);font-weight:700;font-size:11.5px;width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:background .15s,color .15s}
.ch-btn.correct{border-color:var(--teal);background:var(--teal-bg)}.ch-btn.correct .letter{background:var(--teal);color:#fff}
.ch-btn.wrong{border-color:var(--red);background:#fff5f5}.ch-btn.wrong .letter{background:var(--red);color:#fff}
.ch-btn.revealed{border-color:var(--teal);background:var(--teal-bg);opacity:.6}.ch-btn.revealed .letter{background:var(--teal);color:#fff}
.ch-btn:disabled{cursor:default}
.feedback{display:none;margin-top:10px;padding:11px 13px;border-radius:7px;font-size:13px;line-height:1.5}
.feedback.correct{display:block;background:var(--teal-bg);border-left:4px solid var(--teal)}
.feedback.wrong{display:block;background:#fff5f5;border-left:4px solid var(--red)}
.feedback strong{display:block;margin-bottom:2px}
#complete{display:none;background:var(--teal-dk);border:2px solid var(--teal);border-radius:10px;padding:20px;text-align:center;animation:fi .4s ease}
#complete .ck{font-size:34px;margin-bottom:5px;display:block}
#complete h3{font-family:"Oswald",Arial,sans-serif;font-size:19px;color:var(--teal);margin-bottom:3px}
#complete p{color:#ccc;font-size:12.5px;margin-bottom:12px}
.restart{display:inline-block;background:transparent;color:var(--teal);border:1.5px solid var(--teal);padding:6px 16px;border-radius:5px;font-size:12.5px;cursor:pointer;font-family:"Source Sans 3",Arial,sans-serif;transition:background .15s,color .15s}
.restart:hover{background:var(--teal);color:#fff}
#nav{background:#f5f5f5;border-top:2px solid var(--teal);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
#step-ind{font-size:11.5px;color:var(--muted);text-align:center;flex:1}
.nbtn{background:var(--dark);color:#fff;border:none;border-radius:5px;padding:7px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:"Source Sans 3",Arial,sans-serif;transition:background .15s;min-width:74px}
.nbtn:hover{background:var(--teal)}.nbtn:disabled,.nbtn.locked{background:#ccc;color:#888;cursor:default}
</style>
</head>
<body>
<div id="shell">
<header>
  <div class="course-label">AUTOA 123 · Micro Lesson</div>
  <h1>Charging Systems — Testing Sequence</h1>
  <div class="sub">Charging Voltage · Voltage Drop · Output Test · Interpretation</div>
</header>
<div id="prog-wrap">
  <div id="prog-lbl">Progress</div>
  <div id="prog-track"><div id="prog-bar"></div></div>
</div>
<div id="content"></div>
<div id="nav">
  <button class="nbtn" id="back-btn" onclick="go(-1)" disabled>← Back</button>
  <div id="step-ind">—</div>
  <button class="nbtn" id="next-btn" onclick="go(1)">Next →</button>
</div>
</div>
<script>
const SL=[
{"heading":"Charging Voltage Test & Voltage Drop","icon":"🔋","svg":"<svg viewBox=\"0 0 700 190\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#ffffff;border-radius:8px;margin:10px 0 8px;display:block;max-width:100%\"><text x=\"350\" y=\"15\" font-size=\"11\" fill=\"#555555\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">CHARGING VOLTAGE TEST — DVOM SETUP &amp; INTERPRETATION</text><rect x=\"20\" y=\"28\" width=\"250\" height=\"148\" fill=\"#f0faf8\" stroke=\"#2a9d8f\" stroke-width=\"2\" rx=\"7\"/><text x=\"145\" y=\"46\" font-size=\"10\" fill=\"#2a9d8f\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">TEST PROCEDURE</text><text x=\"145\" y=\"62\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">1. DVOM → DC VOLTS</text><text x=\"145\" y=\"76\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">2. RED to battery positive</text><text x=\"145\" y=\"90\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">3. BLACK to battery negative</text><text x=\"145\" y=\"104\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">4. Start engine, rev to 2,000 RPM</text><text x=\"145\" y=\"118\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">5. Read voltage</text><line x1=\"40\" y1=\"126\" x2=\"250\" y2=\"126\" stroke=\"#d0ede8\" stroke-width=\"0.8\"/><text x=\"145\" y=\"140\" font-size=\"9\" fill=\"#e9a825\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">Add load to confirm:</text><text x=\"145\" y=\"154\" font-size=\"9\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Turn on headlights + A/C</text><text x=\"145\" y=\"166\" font-size=\"9\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Voltage should hold within spec</text><rect x=\"290\" y=\"28\" width=\"390\" height=\"148\" fill=\"#f5f5f5\" stroke=\"#555555\" stroke-width=\"1\" rx=\"7\"/><text x=\"485\" y=\"46\" font-size=\"10\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">INTERPRETING RESULTS</text><rect x=\"305\" y=\"56\" width=\"360\" height=\"26\" fill=\"#f0faf8\" stroke=\"#2a9d8f\" stroke-width=\"1.5\" rx=\"4\"/><text x=\"485\" y=\"68\" font-size=\"9\" fill=\"#2a9d8f\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">13.5–14.5V → NORMAL</text><text x=\"485\" y=\"78\" font-size=\"8\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Charging system functioning correctly. Proceed to AC ripple test.</text><rect x=\"305\" y=\"90\" width=\"360\" height=\"26\" fill=\"#fff5f5\" stroke=\"#cc0000\" stroke-width=\"1.5\" rx=\"4\"/><text x=\"485\" y=\"102\" font-size=\"9\" fill=\"#cc0000\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">Below 13.5V → Possible undercharge</text><text x=\"485\" y=\"112\" font-size=\"8\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Check scan tool first on modern vehicles — may be eco mode</text><rect x=\"305\" y=\"124\" width=\"360\" height=\"26\" fill=\"#fff5f5\" stroke=\"#cc0000\" stroke-width=\"1.5\" rx=\"4\"/><text x=\"485\" y=\"136\" font-size=\"9\" fill=\"#cc0000\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">Above 15.0V → Overcharge</text><text x=\"485\" y=\"146\" font-size=\"8\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Check alternator GROUND FIRST before condemning regulator</text><rect x=\"305\" y=\"158\" width=\"360\" height=\"18\" fill=\"#fffbf0\" stroke=\"#e9a825\" stroke-width=\"1\" rx=\"4\"/><text x=\"485\" y=\"170\" font-size=\"8.5\" fill=\"#b07d00\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">Always test battery first — min 75% SOC before this test is valid</text></svg>","body":["<strong>Always test the battery first.</strong> The battery must be at least 75% SOC and pass a load test before any charging system testing is valid. A weak battery draws maximum alternator output — making a good alternator look like it's failing.","Charging voltage test: set DVOM to <strong>DC volts</strong>, connect to battery terminals, start engine, rev to 2,000 RPM. Spec: <strong>13.5–14.5V</strong>. Add headlights and A/C to confirm voltage holds under load.","If voltage reads below 13.5V on a modern vehicle: <strong>check scan tool first</strong> (eco mode is normal). If scan tool shows high field duty cycle and voltage is still low → alternator or wiring fault.","If voltage reads above 15.0V: <strong>check alternator ground first</strong>. Measure voltage drop from alternator case to battery negative. Over 0.2V = bad ground. Fix ground before diagnosing the regulator."]},
{"heading":"Voltage Drop Test — Both Sides","icon":"📏","svg":"<svg viewBox=\"0 0 700 190\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#ffffff;border-radius:8px;margin:10px 0 8px;display:block;max-width:100%\"><text x=\"350\" y=\"15\" font-size=\"11\" fill=\"#555555\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">CHARGING CIRCUIT VOLTAGE DROP TEST — LEAD PLACEMENT</text><rect x=\"15\" y=\"28\" width=\"320\" height=\"155\" fill=\"#f0faf8\" stroke=\"#2a9d8f\" stroke-width=\"2\" rx=\"7\"/><text x=\"175\" y=\"46\" font-size=\"10\" fill=\"#2a9d8f\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">POSITIVE SIDE</text><text x=\"175\" y=\"62\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">RED lead → alternator output terminal (B+)</text><text x=\"175\" y=\"76\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">BLACK lead → battery positive post</text><text x=\"175\" y=\"90\" font-size=\"9\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Engine running, headlights on, 2,000 RPM</text><line x1=\"35\" y1=\"100\" x2=\"315\" y2=\"100\" stroke=\"#d0ede8\" stroke-width=\"0.8\"/><text x=\"175\" y=\"114\" font-size=\"9\" fill=\"#e9a825\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">Spec: UNDER 0.4V (400 mV)</text><text x=\"175\" y=\"128\" font-size=\"9\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Over spec = resistance in output cable</text><text x=\"175\" y=\"142\" font-size=\"9\" fill=\"#cc0000\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">Battery voltage reading = OPEN circuit</text><text x=\"175\" y=\"158\" font-size=\"8.5\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">No connection between alternator and battery positive</text><rect x=\"355\" y=\"28\" width=\"330\" height=\"155\" fill=\"#f5f5f5\" stroke=\"#555555\" stroke-width=\"1\" rx=\"7\"/><text x=\"520\" y=\"46\" font-size=\"10\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">NEGATIVE SIDE</text><text x=\"520\" y=\"62\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">RED lead → alternator CASE (housing)</text><text x=\"520\" y=\"76\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">BLACK lead → battery negative post</text><text x=\"520\" y=\"90\" font-size=\"9\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Same load and RPM as positive test</text><line x1=\"370\" y1=\"100\" x2=\"670\" y2=\"100\" stroke=\"#d0d0d0\" stroke-width=\"0.8\"/><text x=\"520\" y=\"114\" font-size=\"9\" fill=\"#e9a825\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">Spec: UNDER 0.4V (400 mV)</text><text x=\"520\" y=\"128\" font-size=\"9\" fill=\"#cc0000\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">Fix ground BEFORE condemning alternator</text><text x=\"520\" y=\"142\" font-size=\"9\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">High reading here = bad alternator ground</text><text x=\"520\" y=\"158\" font-size=\"8.5\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">A good alternator with bad ground = same symptoms as failure</text></svg>","body":["The alternator may be producing adequate voltage, but <strong>resistance in the wiring can steal it before it reaches the battery</strong>. The voltage drop test finds this hidden resistance.","<strong>Positive side:</strong> RED lead to alternator output terminal, BLACK lead to battery positive post. Engine running under load at 2,000 RPM. Spec: <strong>under 0.4V (400 mV)</strong>.","<strong>Negative side:</strong> RED lead to alternator case (housing), BLACK lead to battery negative post. Same conditions. Spec: <strong>under 0.4V</strong>. High reading here = bad alternator ground — fix ground before anything else.","<strong>Special reading:</strong> If you measure battery voltage (12V+) across either conductor, there is an <strong>open circuit</strong> — the connection between those two test points is broken. Test both sides — a good positive side with a bad ground still means the battery is not getting the full charging voltage."]},
{"heading":"Alternator Output Test — Carbon Pile","icon":"⚙️","svg":"<svg viewBox=\"0 0 700 185\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#ffffff;border-radius:8px;margin:10px 0 8px;display:block;max-width:100%\"><text x=\"350\" y=\"15\" font-size=\"11\" fill=\"#555555\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">ALTERNATOR OUTPUT TEST — CARBON PILE PROCEDURE</text><rect x=\"15\" y=\"28\" width=\"260\" height=\"148\" fill=\"#f0faf8\" stroke=\"#2a9d8f\" stroke-width=\"2\" rx=\"7\"/><text x=\"145\" y=\"46\" font-size=\"10\" fill=\"#2a9d8f\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">PROCEDURE</text><text x=\"145\" y=\"62\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">1. Connect ammeter leads to battery</text><text x=\"145\" y=\"76\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">2. Turn OFF all accessories</text><text x=\"145\" y=\"90\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">3. Start engine → steady 2,000 RPM</text><text x=\"145\" y=\"104\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">4. Slowly increase load knob</text><text x=\"145\" y=\"118\" font-size=\"9\" fill=\"#cc0000\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">5. Do NOT drop below 12.6V</text><text x=\"145\" y=\"132\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">6. Record highest amperage</text><text x=\"145\" y=\"146\" font-size=\"9\" fill=\"#e9a825\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">7. Add 5–7A for ignition system</text><text x=\"145\" y=\"164\" font-size=\"8.5\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">This corrects for current drawn</text><text x=\"145\" y=\"174\" font-size=\"8.5\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">by ignition during the test</text><rect x=\"295\" y=\"28\" width=\"390\" height=\"148\" fill=\"#f5f5f5\" stroke=\"#555555\" stroke-width=\"1\" rx=\"7\"/><text x=\"490\" y=\"46\" font-size=\"10\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">MATH &amp; ACCEPTANCE CRITERIA</text><rect x=\"310\" y=\"56\" width=\"360\" height=\"50\" fill=\"#0d2b28\" stroke=\"#2a9d8f\" stroke-width=\"1.5\" rx=\"4\"/><text x=\"490\" y=\"72\" font-size=\"9\" fill=\"#2a9d8f\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">EXAMPLE:</text><text x=\"490\" y=\"86\" font-size=\"9\" fill=\"#cccccc\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Rated: 120A · Measured: 92A · Add 6A = 98A corrected</text><text x=\"490\" y=\"100\" font-size=\"9\" fill=\"#e9a825\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">10% of 120A = 12A → Min = 108A → 98A FAILS</text><rect x=\"310\" y=\"116\" width=\"360\" height=\"26\" fill=\"#f0faf8\" stroke=\"#2a9d8f\" stroke-width=\"1.5\" rx=\"4\"/><text x=\"490\" y=\"128\" font-size=\"9\" fill=\"#2a9d8f\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">Within 10% of rated → PASS</text><text x=\"490\" y=\"138\" font-size=\"8\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Find rated output in ShopKey for the specific vehicle</text><rect x=\"310\" y=\"150\" width=\"360\" height=\"26\" fill=\"#fff5f5\" stroke=\"#cc0000\" stroke-width=\"1.5\" rx=\"4\"/><text x=\"490\" y=\"162\" font-size=\"9\" fill=\"#cc0000\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">More than 10% below rated → FAIL</text><text x=\"490\" y=\"172\" font-size=\"8\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Alternator insufficient — recommend replacement</text></svg>","body":["The output test measures whether the alternator can produce its <strong>rated amperage</strong> on demand. Connect ammeter, turn off all accessories, start engine at steady 2,000 RPM, and slowly increase the carbon pile load.","<strong>Critical:</strong> Do not let voltage drop below 12.6V during the test — if it does, release the load immediately. The test is invalid below 12.6V.","After recording the highest reading, <strong>add 5–7 amperes</strong> to account for current drawn by the ignition system during the test. This is your corrected output.","<strong>Acceptance criteria:</strong> corrected output must be within 10% of rated output (look up rated output in ShopKey). Example: 120A rated → minimum acceptable = 108A. Always compare to the specific vehicle's rated output — never use a flat number."]}
];
const QS=[
{"text":"A charging voltage test on a 2019 Honda Accord shows 14.2V at 2,000 RPM with headlights on. A positive-side voltage drop test then shows 1.4V between the alternator output terminal and the battery positive post. What is the actual voltage reaching the battery?","choices":["14.2V — the voltage drop test does not affect charging voltage","12.8V — 1.4V is lost in the output cable before reaching the battery","15.6V — the drop adds to the available voltage","13.0V — only the negative side drop matters"],"correct":1,"explanation":"Voltage drop is voltage stolen by resistance in the wiring. If 14.2V is measured at the alternator output terminal and 1.4V is lost across the positive cable, then only 14.2V − 1.4V = 12.8V actually reaches the battery positive post. The battery is being undercharged despite the alternator producing adequate voltage. The fix is to inspect and replace the high-resistance output cable — not the alternator."},
{"text":"During a carbon pile output test, the ammeter reaches 95A before voltage drops to 12.6V. The technician adds 6A for the ignition system. The alternator is rated at 120A. Does this alternator pass the output test?","choices":["Yes — 95A is close enough to 120A rated","Yes — 101A corrected is within 10% of 120A rated","No — 101A corrected is more than 10% below the 120A rating","No — voltage dropped during the test which automatically fails it"],"correct":2,"explanation":"Math: 95A measured + 6A correction = 101A corrected. 10% of 120A rated = 12A. Minimum acceptable = 120 − 12 = 108A. Since 101A is below 108A, the alternator FAILS the output test — it is more than 10% below rated output. The alternator is not producing enough amperage for the vehicle's electrical demands. Note: the technician correctly stopped before 12.6V — the test procedure was followed correctly, the alternator just failed."},
{"text":"Technician A says the battery should be fully charged before performing a charging system output test. Technician B says the battery state does not matter — the carbon pile provides the load, not the battery. Who is correct?","choices":["Technician A only","Technician B only","Both Technician A and Technician B","Neither technician"],"correct":0,"explanation":"Technician A is correct. A weak or discharged battery will draw maximum alternator output throughout the test — the alternator spends the entire test trying to recharge the battery rather than responding to the carbon pile load. When the carbon pile adds additional load, voltage drops below 12.6V almost immediately. The technician records a low number and misdiagnoses a good alternator as underperforming. The battery must be at minimum 75% SOC (≥12.45V OCV, passes load test) before the output test is valid."}
];
const TOT=SL.length+QS.length;
let cur=0,ans=new Array(QS.length).fill(false);
const LT=['A','B','C','D'];
function prog(n){const p=Math.round(n/TOT*100);document.getElementById('prog-bar').style.width=p+'%';document.getElementById('prog-lbl').textContent='Progress — '+p+'%';}
function go(d){cur+=d;if(cur<0)cur=0;if(cur>=TOT)return;render();}
function render(){
  const el=document.getElementById('content');
  const isS=cur<SL.length;
  document.getElementById('back-btn').disabled=(cur===0);
  document.getElementById('next-btn').disabled=false;
  document.getElementById('next-btn').classList.remove('locked');
  if(cur>=TOT){prog(TOT);el.innerHTML='';showDone(el);document.getElementById('nav').style.display='none';return;}
  prog(cur);
  document.getElementById('nav').style.display='flex';
  if(isS){document.getElementById('step-ind').textContent='Slide '+(cur+1)+' of '+SL.length;renderS(SL[cur],el);}
  else{const qi=cur-SL.length;document.getElementById('step-ind').textContent='Question '+(qi+1)+' of '+QS.length;if(!ans[qi]){document.getElementById('next-btn').classList.add('locked');document.getElementById('next-btn').disabled=true;}renderQ(qi,QS[qi],el);}
}
function renderS(s,el){const body=s.body.map(b=>'<p>'+b+'</p>').join('');el.innerHTML='<div class="slide active"><span class="slide-icon">'+s.icon+'</span><h2>'+s.heading+'</h2>'+(s.svg?'<div class="slide-svg">'+s.svg+'</div>':'')+'<div class="slide-body">'+body+'</div></div>';}
function renderQ(qi,q,el){const ch=q.choices.map((c,i)=>'<li><button class="ch-btn" onclick="pick('+qi+','+i+',this)" id="c'+qi+'_'+i+'"><span class="letter">'+LT[i]+'</span><span>'+c+'</span></button></li>').join('');el.innerHTML='<div class="quiz active"><div class="quiz-lbl">Knowledge Check · Question '+(qi+1)+' of '+QS.length+'</div><h2>'+q.text+'</h2><ul class="choices">'+ch+'</ul><div class="feedback" id="fb'+qi+'"></div></div>';if(ans[qi])restoreQ(qi,q);}
function pick(qi,ch,btn){if(ans[qi])return;ans[qi]=true;const q=QS[qi],ok=q.correct;document.querySelectorAll('.ch-btn').forEach((b,i)=>{b.disabled=true;if(i===ok)b.classList.add(ch===ok?'correct':'revealed');});if(ch!==ok)btn.classList.add('wrong');const fb=document.getElementById('fb'+qi);fb.className='feedback '+(ch===ok?'correct':'wrong');fb.innerHTML='<strong>'+(ch===ok?'✓ Correct!':'✗ Not quite.')+'</strong>'+q.explanation;document.getElementById('next-btn').classList.remove('locked');document.getElementById('next-btn').disabled=false;if(qi===QS.length-1)document.getElementById('next-btn').textContent='Finish →';}
function restoreQ(qi,q){document.querySelectorAll('.ch-btn').forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('revealed');});const fb=document.getElementById('fb'+qi);if(fb){fb.className='feedback correct';fb.innerHTML='<strong>Already answered.</strong>';}}
function showDone(el){el.innerHTML='<div id="complete"><span class="ck">✅</span><h3>Lesson Complete</h3><p>All slides and knowledge check questions finished.</p><button class="restart" onclick="restart()">&#8635; Restart Lesson</button></div>';}
function restart(){cur=0;ans=new Array(QS.length).fill(false);document.getElementById('next-btn').textContent='Next →';document.getElementById('nav').style.display='flex';render();}
render();
</script>
</body>
</html>
