25\" stroke-width=\"2\" rx=\"5\"/><text x=\"525\" y=\"48\" font-size=\"10\" fill=\"#e9a825\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">SOLENOID S</text><text x=\"525\" y=\"61\" font-size=\"8.5\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">terminal gets power</text><rect x=\"20\" y=\"100\" width=\"660\" height=\"70\" fill=\"#f5f5f5\" stroke=\"#d0d0d0\" stroke-width=\"1\" rx=\"6\"/><text x=\"350\" y=\"117\" font-size=\"10\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">Two separate circuits — control happens BEFORE high current flows</text><text x=\"185\" y=\"138\" font-size=\"9\" fill=\"#2a9d8f\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">CONTROL CIRCUIT (low current)</text><text x=\"185\" y=\"152\" font-size=\"9\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Key switch → PCM → relay coil → S terminal</text><text x=\"185\" y=\"164\" font-size=\"9\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Small wire, low amperage</text><text x=\"515\" y=\"138\" font-size=\"9\" fill=\"#e9a825\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">POWER CIRCUIT (high current)</text><text x=\"515\" y=\"152\" font-size=\"9\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Battery → solenoid contacts → motor</text><text x=\"515\" y=\"164\" font-size=\"9\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Heavy cable, 150–300A</text><defs><marker id=\"a\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#2a9d8f\"/></marker><marker id=\"b\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"#e9a825\"/></marker></defs></svg>",
  "body":[
    "The starter system has <strong>two completely separate circuits</strong>: a low-current control circuit that authorizes the start, and a high-current power circuit that actually cranks the engine. Pre-engagement is everything that happens in the control circuit before any high current flows.",
    "When the driver turns the key or presses the start button, a <strong>start signal</strong> is sent to the PCM or BCM. On modern vehicles, the PCM doesn't just pass the signal through — it <strong>checks a list of conditions</strong> first. Only if all conditions are satisfied does it command the starter relay to close.",
    "The relay coil receives a ground (or B+) signal from the PCM, closes its internal contacts, and sends battery voltage to the <strong>S (solenoid) terminal</strong> on the starter. That's the handoff from control circuit to power circuit.",
    "A no-crank with <strong>no click at all</strong> points to the control circuit — the relay never energized. A single loud click points to the relay closing but the solenoid or power circuit failing. Knowing which you hear immediately narrows the diagnosis."
  ]
},
{
  "heading":"The Starter Relay — Function and Testing",
  "icon":"🔌",
  "svg":"<svg viewBox=\"0 0 700 190\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#ffffff;border-radius:8px;margin:10px 0 8px;display:block;max-width:100%\"><text x=\"350\" y=\"15\" font-size=\"11\" fill=\"#555555\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">STARTER RELAY — INTERNAL OPERATION AND TEST POINTS</text><rect x=\"160\" y=\"30\" width=\"380\" height=\"130\" fill=\"#f0faf8\" stroke=\"#2a9d8f\" stroke-width=\"2\" rx=\"8\"/><text x=\"350\" y=\"48\" font-size=\"10\" fill=\"#2a9d8f\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">RELAY INTERNALS</text><rect x=\"175\" y=\"58\" width=\"100\" height=\"36\" fill=\"#1a1a1a\" stroke=\"#2a9d8f\" stroke-width=\"1.5\" rx=\"4\"/><text x=\"225\" y=\"74\" font-size=\"9\" fill=\"#2a9d8f\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">COIL</text><text x=\"225\" y=\"86\" font-size=\"8.5\" fill=\"#aaa\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">86 (+) / 85 (−)</text><line x1=\"275\" y1=\"76\" x2=\"320\" y2=\"76\" stroke=\"#2a9d8f\" stroke-width=\"1.5\"/><text x=\"350\" y=\"72\" font-size=\"9\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Magnetic field</text><text x=\"350\" y=\"84\" font-size=\"9\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">closes contacts</text><line x1=\"380\" y1=\"76\" x2=\"420\" y2=\"76\" stroke=\"#e9a825\" stroke-width=\"1.5\"/><rect x=\"420\" y=\"58\" width=\"100\" height=\"36\" fill=\"#fffbf0\" stroke=\"#e9a825\" stroke-width=\"1.5\" rx=\"4\"/><text x=\"470\" y=\"74\" font-size=\"9\" fill=\"#e9a825\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">CONTACTS</text><text x=\"470\" y=\"86\" font-size=\"8.5\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">30 (B+) / 87 (out)</text><rect x=\"175\" y=\"115\" width=\"160\" height=\"32\" fill=\"#f5f5f5\" stroke=\"#555555\" stroke-width=\"1\" rx=\"4\"/><text x=\"255\" y=\"129\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">Coil test: resistance</text><text x=\"255\" y=\"141\" font-size=\"8.5\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Typical: 50–120 Ω pin 85→86</text><rect x=\"365\" y=\"115\" width=\"160\" height=\"32\" fill=\"#f5f5f5\" stroke=\"#555555\" stroke-width=\"1\" rx=\"4\"/><text x=\"445\" y=\"129\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">Contact test: continuity</text><text x=\"445\" y=\"141\" font-size=\"8.5\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Apply 12V to coil → check 30→87</text></svg>",
  "body":[
    "The starter relay is a <strong>remote switch</strong> — its job is to use a small PCM-controlled signal to close a set of heavier contacts that pass current to the solenoid S terminal. It keeps high current out of the passenger compartment and away from the ignition switch.",
    "<strong>Standard relay pinout (ISO mini relay):</strong> Pin 86 = coil B+, Pin 85 = coil ground (PCM-controlled), Pin 30 = battery B+ in, Pin 87 = switched output to solenoid. The PCM typically controls the ground side (pin 85).",
    "<strong>Testing the relay:</strong> (1) Measure coil resistance between pins 85 and 86 — typical spec is 50–120 Ω. Open = bad coil. (2) Apply 12V to pin 86, ground pin 85 — confirm continuity between pins 30 and 87. No continuity = bad contacts.",
    "<strong>Quick field test:</strong> With a suspected bad relay, swap it with an identical relay from the same fuse box (horn, fuel pump) and attempt to start. This takes 10 seconds and costs nothing. If it starts, the relay was the problem."
  ]
},

  "svg":"<svg viewBox=\"0 0 700 190\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#ffffff;border-radius:8px;margin:10px 0 8px;display:block;max-width:100%\"><text x=\"350\" y=\"15\" font-size=\"11\" fill=\"#555555\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">INHIBIT SIGNALS — CONDITIONS THAT BLOCK STARTER ENGAGEMENT</text><rect x=\"20\" y=\"28\" width=\"200\" height=\"148\" fill=\"#f0faf8\" stroke=\"#2a9d8f\" stroke-width=\"2\" rx=\"7\"/><text x=\"120\" y=\"46\" font-size=\"10\" fill=\"#2a9d8f\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">NEUTRAL SAFETY / INHIBIT</text><text x=\"120\" y=\"62\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">AT (Park or Neutral only)</text><text x=\"120\" y=\"76\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">MT (clutch pedal depressed)</text><text x=\"120\" y=\"90\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Brake pedal (push-button start)</text><text x=\"120\" y=\"104\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Key fob / keyless authentication</text><text x=\"120\" y=\"118\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Hood ajar (some models)</text><text x=\"120\" y=\"132\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Anti-theft / immobilizer</text><text x=\"120\" y=\"152\" font-size=\"8.5\" fill=\"#2a9d8f\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">All must be satisfied</text><text x=\"120\" y=\"164\" font-size=\"8.5\" fill=\"#2a9d8f\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">before PCM commands relay</text><rect x=\"240\" y=\"28\" width=\"220\" height=\"148\" fill=\"#f5f5f5\" stroke=\"#555555\" stroke-width=\"1\" rx=\"7\"/><text x=\"350\" y=\"46\" font-size=\"10\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">HOW THEY WORK</text><text x=\"350\" y=\"64\" font-size=\"9\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Traditional NSS:</text><text x=\"350\" y=\"77\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Opens/closes in series</text><text x=\"350\" y=\"89\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">with the control circuit</text><line x1=\"255\" y1=\"100\" x2=\"450\" y2=\"100\" stroke=\"#d0d0d0\" stroke-width=\"0.8\"/><text x=\"350\" y=\"116\" font-size=\"9\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Modern PCM-based:</text><text x=\"350\" y=\"129\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Signal sent to PCM as</text><text x=\"350\" y=\"141\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">a data input (not wired</text><text x=\"350\" y=\"153\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">in series)</text><rect x=\"480\" y=\"28\" width=\"200\" height=\"148\" fill=\"#fff5f5\" stroke=\"#cc0000\" stroke-width=\"2\" rx=\"7\"/><text x=\"580\" y=\"46\" font-size=\"10\" fill=\"#cc0000\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">DIAGNOSTIC TIPS</text><text x=\"580\" y=\"62\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">No-crank, no click:</text><text x=\"580\" y=\"75\" font-size=\"9\" fill=\"#cc0000\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Arial,sans-serif\">Check scan tool FIRST</text><text x=\"580\" y=\"89\" font-size=\"9\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Look for inhibit DTCs</text><text x=\"580\" y=\"103\" font-size=\"9\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Check PRNDL input</text><line x1=\"490\" y1=\"114\" x2=\"670\" y2=\"114\" stroke=\"#ffcccc\" stroke-width=\"0.8\"/><text x=\"580\" y=\"128\" font-size=\"9\" fill=\"#1a1a1a\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">MT clutch switch:</text><text x=\"580\" y=\"141\" font-size=\"9\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Jumper it at the switch</text><text x=\"580\" y=\"153\" font-size=\"9\" fill=\"#555555\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">connector to confirm</text><text x=\"580\" y=\"165\" font-size=\"8.5\" fill=\"#cc0000\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Never jumper at PCM</text></svg>",
  "body":[
    "Before the PCM commands the starter relay to close, it checks a series of <strong>inhibit conditions</strong>. Any one of these failing will result in a no-crank with no relay click — the control circuit never completes.",
    "<strong>Neutral Safety Switch (NSS) / Transmission Range Sensor:</strong> On automatic transmissions, the starter is only permitted in Park or Neutral. On manual transmissions, the clutch pedal switch must confirm the clutch is depressed. These are safety devices — the vehicle must not be able to start in gear.",
    "<strong>Modern vehicles</strong> often don't wire the NSS in series with the control circuit. Instead, the transmission range sensor or clutch switch sends a <strong>data signal to the PCM</strong>. The PCM decides whether to allow the start. This means a bad range sensor signal can prevent starting even if the relay, solenoid, and motor are all perfectly fine.",
    "<strong>Other inhibit signals include:</strong> brake pedal (required for push-button start), key fob authentication (PATS, immobilizer), and on some vehicles a hood ajar switch. <strong>Always pull scan tool data first on a no-crank</strong> — inhibit DTCs will point directly to which signal is blocking the start."

  ],
  "correct":0,
  "explanation":"Technician A is correct. The relay exists to keep high solenoid current out of the PCM and ignition switch — PCM outputs are designed for low-current switching, not the current required to energize a starter solenoid. Technician B is incorrect: while some vehicles integrate the relay into the IPDM or smart junction box, there is always a relay-equivalent switching device in the circuit. The PCM does not drive the solenoid directly."
}
];
const TOT=SL.length+QS.length;
let cur=0,ans=new Array(QS.length).fill(false);
const LT=['A','B','C','D'];
function prog(n){const p=Math.round(n/TOT*100);document.getElementById('prog-bar').style.width=p+'%';document.getElementById('prog-lbl').textContent='Progress — '+p+'%';}
function go(d){cur+=d;if(cur<0)cur=0;if(cur>=TOT)return;render();}
function render(){
  const el=document.getElementById('content');
  const isS=cur<SL.length;
  document.getElementById('back-btn').disabled=(cur===0);
  document.getElementById('next-btn').disabled=false;
  document.getElementById('next-btn').classList.remove('locked');
  if(cur>=TOT){prog(TOT);el.innerHTML='';showDone(el);document.getElementById('nav').style.display='none';return;}
  prog(cur);
  document.getElementById('nav').style.display='flex';
  if(isS){document.getElementById('step-ind').textContent='Slide '+(cur+1)+' of '+SL.length;renderS(SL[cur],el);}
  else{const qi=cur-SL.length;document.getElementById('step-ind').textContent='Question '+(qi+1)+' of '+QS.length;if(!ans[qi]){document.getElementById('next-btn').classList.add('locked');document.getElementById('next-btn').disabled=true;}renderQ(qi,QS[qi],el);}
}
function renderS(s,el){const body=s.body.map(b=>'<p>'+b+'</p>').join('');el.innerHTML='<div class="slide active"><span class="slide-icon">'+s.icon+'</span><h2>'+s.heading+'</h2>'+(s.svg?'<div class="slide-svg">'+s.svg+'</div>':'')+'<div class="slide-body">'+body+'</div></div>';}
function renderQ(qi,q,el){const ch=q.choices.map((c,i)=>'<li><button class="ch-btn" onclick="pick('+qi+','+i+',this)" id="c'+qi+'_'+i+'"><span class="letter">'+LT[i]+'</span><span>'+c+'</span></button></li>').join('');el.innerHTML='<div class="quiz active"><div class="quiz-lbl">Knowledge Check · Question '+(qi+1)+' of '+QS.length+'</div><h2>'+q.text+'</h2><ul class="choices">'+ch+'</ul><div class="feedback" id="fb'+qi+'"></div></div>';if(ans[qi])restoreQ(qi,q);}
function pick(qi,ch,btn){if(ans[qi])return;ans[qi]=true;const q=QS[qi],ok=q.correct;document.querySelectorAll('.ch-btn').forEach((b,i)=>{b.disabled=true;if(i===ok)b.classList.add(ch===ok?'correct':'revealed');});if(ch!==ok)btn.classList.add('wrong');const fb=document.getElementById('fb'+qi);fb.className='feedback '+(ch===ok?'correct':'wrong');fb.innerHTML='<strong>'+(ch===ok?'✓ Correct!':'✗ Not quite.')+'</strong>'+q.explanation;document.getElementById('next-btn').classList.remove('locked');document.getElementById('next-btn').disabled=false;if(qi===QS.length-1)document.getElementById('next-btn').textContent='Finish →';}
function restoreQ(qi,q){document.querySelectorAll('.ch-btn').forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('revealed');});const fb=document.getElementById('fb'+qi);if(fb){fb.className='feedback correct';fb.innerHTML='<strong>Already answered.</strong>';}}
function showDone(el){el.innerHTML='<div id="complete"><span class="ck">✅</span><h3>Lesson Complete</h3><p>All slides and knowledge check questions finished.</p><button class="restart" onclick="restart()">&#8635; Restart Lesson</button></div>';}
function restart(){cur=0;ans=new Array(QS.length).fill(false);document.getElementById('next-btn').textContent='Next →';document.getElementById('nav').style.display='flex';render();}
render();
</script>
</body>
</html>
